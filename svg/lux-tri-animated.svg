<svg role="img" aria-label="Lux" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- 3-D pyramid tumble (symmetric ridge + specular rake) → hover: vertical-axis turn → press: squash. Pure CSS, no JS. Generated from the @hanzo logo tuner — edit there, not here. -->
<defs>
<linearGradient id="lxridge" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#6f6f80"/><stop offset=".5" stop-color="#6f6f80" stop-opacity="0"/><stop offset="1" stop-color="#6f6f80"/></linearGradient>
<linearGradient id="lxsheen" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="lxtri"><path d="M50 88 L17.09 31 L82.91 31 Z"/></clipPath>
</defs>
<style>
.pyr{transform-box:view-box;transform-origin:50px 50px;opacity:0;animation:lxrise 1.07s cubic-bezier(.55,0,.3,1) forwards}
@keyframes lxrise{0%{opacity:0;transform:perspective(340px) rotateX(9.63deg) translateY(8%) scale(.05)}30%{opacity:1}72%{transform:perspective(340px) rotateX(9.63deg) translateY(-1%) scale(1.05)}100%{opacity:1;transform:perspective(340px) rotateX(9.63deg) translateY(0) scale(1)}}
.shade{opacity:0;animation:lxshade 1.07s cubic-bezier(.62,0,.18,1) forwards}
@keyframes lxshade{0%{opacity:0}30%{opacity:.82}100%{opacity:.17}}
.spec{opacity:0;transform:translateX(-70px) rotate(-29deg);transform-box:fill-box;transform-origin:center;animation:lxspec 1.07s cubic-bezier(.5,0,.2,1) forwards}
@keyframes lxspec{0%{opacity:0;transform:translateX(-70px) rotate(-29deg)}42%{opacity:.85}100%{opacity:0;transform:translateX(70px) rotate(-29deg)}}
@media (prefers-reduced-motion:reduce){.pyr,.shade,.spec{animation:none;transform:none;opacity:1}.pyr{transform:perspective(340px) rotateX(9.63deg)}.shade{opacity:.17}.spec{opacity:0}}

/* interaction — pure CSS, no JS: hover = one graceful turn (returns to rest), press = squash */
.lux-hov{transform-box:view-box;transform-origin:50px 50px}
.lux-prs{transform-box:view-box;transform-origin:50px 50px;transition:transform .22s cubic-bezier(.22,1,.36,1)}
svg:hover .lux-hov{animation:luxTurn 1s cubic-bezier(.45,0,.2,1)}
svg:active .lux-prs{transform:scale(.95)}
@keyframes luxTurn{0%{transform:perspective(340px) rotateY(0)}100%{transform:perspective(340px) rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.lux-hov,.lux-prs{animation:none!important;transform:none!important}.pyr,.shade,.spec{animation:none;transform:none;opacity:1}.shade{opacity:.17}.spec{opacity:0}}
</style>
<g class="lux-hov"><g class="lux-prs">
<g class="pyr">
<path d="M50 88 L17.09 31 L82.91 31 Z" fill="#fff"/>
<path class="shade" d="M50 88 L17.09 31 L82.91 31 Z" fill="url(#lxridge)"/>
<g clip-path="url(#lxtri)"><rect class="spec" x="20" y="-12" width="26" height="124" fill="url(#lxsheen)"/></g>
</g>
</g></g>
</svg>